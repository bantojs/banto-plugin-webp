name = "banto-plugin-webp"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# fetch を公開のインターネットと同じ道で出す。無いと、同じ Cloudflare アカウントの Banto の API への fetch が error 1042 で届かない
compatibility_flags = ["global_fetch_strictly_public"]

# 画面（変数とシークレット）で入れた値を、デプロイのたびに消さない
keep_vars = true

# ログ（Workers Logs）。自分の Cloudflare アカウントに数日だけ残る（開発チームには届かない）。
# ここに書かないと、ダッシュボードで ON にしてもデプロイのたびに OFF に戻る。要らなければ false にする
[observability]
enabled = true

# 変換は Cloudflare Images（無料プランは 1 か月 5,000 回の変換。1 枚で本画像とサムネイルの 2 回）
[images]
binding = "IMAGES"

# 前からの画像・枠が切れて止まった分を見回る（1 回に SWEEP_BUDGET 枚、既定 20）
[triggers]
crons = ["17 * * * *"]

# BANTO_API_URL・BANTO_MEDIA_URL は変数、BANTO_API_TOKEN・BANTO_HOOK_SECRET はシークレットで入れる（README の「置き方」）
